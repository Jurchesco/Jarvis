name: Jarvis Import

on:
  schedule:
    # Niedziela 09:00 czasu polskiego (08:00 UTC zimą / 07:00 UTC latem — dostosuj w razie potrzeby)
    - cron: "0 8 * * 0"
  workflow_dispatch:
    inputs:
      days:
        description: "Ile dni wstecz importować"
        required: false
        default: "7"
      skip_modules:
        description: "Pomiń moduły (np. silownia,cialo)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: jarvis-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: Scripts/import

    env:
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      OPENSCALE_DRIVE_FILE_ID: ${{ secrets.OPENSCALE_DRIVE_FILE_ID }}
      GOOGLE_CREDENTIALS_FILE: google-service-account.json
      GARMIN_TOKEN_DIR: .garminconnect
      DEFAULT_DAYS: "7"
      REQUEST_DELAY_SEC: "0.4"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Scripts/import/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Przygotuj Google Service Account
        run: printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > google-service-account.json
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

      - name: Przygotuj tokeny Garmin
        run: |
          python - <<'PY'
          import base64, os, zipfile, io
          from pathlib import Path
          raw = os.environ.get("GARMINCONNECT_ZIP", "")
          if not raw:
              print("Brak GARMINCONNECT_ZIP — moduły Garmin mogą wymagać ponownego logowania.")
              raise SystemExit(0)
          data = base64.b64decode(raw)
          Path(".garminconnect").mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(io.BytesIO(data)) as zf:
              zf.extractall(".garminconnect")
          print("Tokeny Garmin rozpakowane.")
          PY
        env:
          GARMINCONNECT_ZIP: ${{ secrets.GARMINCONNECT_ZIP }}

      - name: Uruchom import
        run: |
          DAYS="${{ github.event.inputs.days || env.DEFAULT_DAYS }}"
          SKIP="${{ github.event.inputs.skip_modules || '' }}"
          ARGS=(--no-prompt --days "$DAYS")
          if [ -n "$SKIP" ]; then
            ARGS+=(--skip "$SKIP")
          fi
          python -m jarvis_import "${ARGS[@]}"

      - name: Podsumowanie (bez sekretów)
        if: always()
        run: echo "Workflow zakończony — sprawdź logi powyżej."
